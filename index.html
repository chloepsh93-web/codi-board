<header><div class="header-inner"><button class="header-back" aria-label="홈으로 돌아가기" onclick="switchTab('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 3-9 9 9 9"/></svg></button><div class="logo">코디 보드</div><details class="header-menu"><summary aria-label="더 보기">•••</summary><div class="menu-content"><div id="weather">날씨 불러오는 중...</div><a href="https://github.com/chloepsh93-web/codi-board">GitHub 저장소</a></div></details></div><nav class="tabs" aria-label="주 메뉴"><button class="active" data-tab="home" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z"/></svg><span>홈</span></button><button class="" data-tab="outfits" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 1 1 3 2v3l8 6v4H3v-4l10-6M3 16h18"/></svg><span>코디 조합</span></button><button class="" data-tab="wardrobe" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2" width="18" height="20" rx="1"/><path d="M12 2v20M8 12h1m6 0h1"/></svg><span>옷장</span></button><button class="" data-tab="records" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="17" rx="1"/><path d="M6 2v6m12-6v6M2 11h20"/></svg><span>기록</span></button><button class="" data-tab="refs" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="1"/><path d="m4 18 6-7 4 4 3-3 4 6"/><circle cx="7" cy="8" r="1"/></svg><span>스타일 레퍼런스</span></button></nav></header>
<main>
  <section id="tab-home" class="tab-panel active">
    <div class="home-date" id="home-date"></div>
    <div class="home-weather-title">오늘의 날씨 <select aria-label="추천 기준" id="weather-basis" onchange="renderHome()"><option value="current">현재 기온</option><option value="daily">오늘 최저·최고</option></select></div>
    <div class="home-weather" id="home-weather"></div>
    <p class="home-guide">오늘 날씨에 맞는 코디를 추천해드려요.</p>
    <div class="recommendations"><div class="curated-label">내 옷으로 입는 오늘</div>
    <div class="rec-heading"><h2 class="rec-section-title">오늘의 코디 추천</h2><div class="rec-subtitle" id="rec-subtitle"></div></div>

  </section>
  <section id="tab-outfits" class="tab-panel">
    <div class="outfits-header">
      <h2 class="outfits-title">오늘 뭐 입지?</h2>
      <p class="outfits-guide">계절에 맞는 코디를 골라보세요. 봄·가을 겸용 코디는 두 계절에서 볼 수 있어요.</p>
    </div>
    <div class="filter-bar" id="season-filter" aria-label="계절별 코디"></div><div class="look-grid" id="outfit-list"></div>
  </section>
  <section id="tab-wardrobe" class="tab-panel">
    <h2 class="wardrobe-title">내 옷장</h2>
    <p class="wardrobe-guide" id="wardrobe-guide"></p><div class="filter-bar" id="wardrobe-filter" aria-label="옷 분류"></div><div class="filter-bar secondary" id="wardrobe-subfilter" aria-label="옷 세부 분류"></div><div class="wardrobe-toolbar"><div class="wardrobe-count" id="wardrobe-count"></div><div><label for="wardrobe-sort">정렬</label><select id="wardrobe-sort" onchange="setWardrobeSort(this.value)"><option value="color">색상순</option><option value="length">길이순</option></select></div></div><p id="sort-guide" class="sort-guide"></p>
    <input class="search-input" id="wardrobe-search" aria-label="옷 검색" placeholder="옷 번호 · 이름 · 브랜드 검색" oninput="renderWardrobe()"><div class="wardrobe-grid" id="wardrobe-grid"></div>
  </section>
  <section id="tab-records" class="tab-panel">
    <div class="section-heading"><div><h2 class="records-title">기록</h2><p class="section-guide">실제로 입은 LOOK과 아이템 조합을 날짜별로 남겨보세요.</p></div><div class="section-count" id="record-count"></div></div>
    <div class="record-form">
      <div><label for="rec-date">입은 날짜</label><input type="date" id="rec-date"></div><div><label for="rec-look">LOOK 선택</label><select id="rec-look" onchange="renderRecordPreview()"></select><button class="btn-small" onclick="chooseRecordLook()">코디 사진으로 선택</button></div><button class="btn-primary" onclick="saveRecord()">저장</button>
    </div>
    <div id="record-preview"></div><label for="rec-note">착용 메모</label><input class="search-input" id="rec-note" maxlength="300" placeholder="예: 저녁에는 조금 추웠어요"><div class="backup-tools"><span>기록은 이 브라우저에 저장됩니다.</span><button class="btn-small" onclick="exportRecords()">기록 내보내기</button><label class="btn-small" for="record-import">가져오기</label><input type="file" id="record-import" accept="application/json,.json" onchange="importRecords(this)" hidden></div><div class="record-list" id="record-list"></div>
  </section>
  <section id="tab-refs" class="tab-panel">
    <div class="section-heading"><div><h2 class="refs-title">스타일 레퍼런스</h2><p class="section-guide"><span class="hl">굵은 컬러 글씨</span>는 연결한 보유품이에요. 대체 가능한 옷은 차이를 함께 표시합니다.</p></div><div class="section-count" id="ref-count"></div></div>

  </section>

// ===== 날씨 (open-meteo 직접 호출) =====
async function loadWeather() {
  const spots = [
    {name: '인천', lat: 37.4563, lon: 126.7052},
    {name: '서울', lat: 37.5665, lon: 126.9780}
  ];
  try {
    const results = await Promise.all(spots.map(async s => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=Asia%2FSeoul`;
      const r = await fetch(url);
      if (!r.ok) throw new Error("날씨 요청 실패");
      const j = await r.json();
      const cur = j.current.temperature_2m;
      const max = j.daily.temperature_2m_max[0];
      const min = j.daily.temperature_2m_min[0];
      return {name: s.name, cur, max, min, updated: j.current.time.slice(11,16)};
    }));
    const html = results.map(r => `${r.name} <b>${r.cur}°C</b>`).join(' &nbsp;|&nbsp; ');
    document.getElementById('weather').innerHTML = html;
    // 홈 날씨 영역 (4-3: 현재 기온 크게, 최저최고 작게)
    document.getElementById('home-weather').innerHTML = results.map(r =>
      `<div class="wx-city"><div class="wx-name">${r.name}</div>` +
      `<div class="wx-temp">${Math.round(r.cur)}<sup>°</sup></div>` +
      `<div class="wx-minmax">${r.name} 기준 · 오늘 ${Math.round(r.min)}~${Math.round(r.max)}°C · ${r.updated} 업데이트</div></div>`
    ).join('');
    // 전역 저장 (보고용)
    window._wx = results;
    renderHome();
  } catch(e) {
    document.getElementById('weather').textContent = '날씨 정보 없음';
    document.getElementById('home-weather').textContent='날씨를 불러오지 못했어요. 계절별 코디를 확인해주세요.';
    window._wx = [];
    renderHome();
  }
}

    return [...SEED_DELETED];
  }
  return JSON.parse(raw);
}

}

  renderHome();
  renderRefs();
}

// ===== 코디 렌더링 =====
function itemById(id) {
  return WARDROBE.find(w => w.id === id);
}

// 분류는 화면용 파생 정보다. 원본 ID와 옷장 데이터는 유지한다.
const SEASONS = ['봄','여름','가을','겨울'];
function getLookSeasons(l) {
  const explicit=SEASONS.filter(x=>(l.season || '').includes(x));
  if(explicit.length) return explicit;
  const garments=l.items.map(itemById).filter(w=>w && !w.id.startsWith('A'));
  const outer=garments.find(w=>w.category.startsWith('아우터/'));
  const tags=w=>w.season.includes('사계절')?SEASONS:SEASONS.filter(x=>w.season.includes(x));
  if(outer) return tags(outer);
  return SEASONS.filter(x=>garments.length && garments.every(w=>tags(w).includes(x)));
}
function lookTitle(l) {
  if(!/^[A-D]-\d+$/.test(l.title || '')) return l.title || '내 옷 코디';
  const garments=l.items.map(itemById).filter(w=>w && !w.id.startsWith('A'));
  const key=garments.filter(w=>w.category.startsWith('아우터/') || w.category.startsWith('원피스/'));
  const basis=(key.length?key:garments).slice(0,1);
  if(key.length>1) basis.push(key[1]);
  const bottom=garments.find(w=>/^(바지|치마)\//.test(w.category));
  const top=garments.find(w=>w.category.startsWith('상의/'));
  if(bottom && !basis.includes(bottom)) basis.push(bottom);
  else if(top && !basis.includes(top)) basis.push(top);
  return basis.map(w=>`${w.color} ${categoryName(w)}`).join(' + ');
}
async function copyReference(label, button) {
  try { await navigator.clipboard.writeText(label); button.textContent='복사 완료'; setTimeout(()=>button.textContent=label+' · 번호 복사',1600); }
  catch(e) { button.textContent=label+' · 이 번호로 요청해주세요'; }
}
let seasonFilter='all';
function setSeasonFilter(value) { seasonFilter=value; renderOutfits(); }
function colorSwatch(color) {
  color=color.split(/[+\/(]/)[0];
  const tones=[['아이보리','#f1e7ce'],['화이트','#fafafa'],['블랙','#292520'],['네이비','#303b5c'],['그레이지','#b9afa1'],['그레이','#a7a7a7'],['회색','#a7a7a7'],['차콜','#565656'],['베이지','#d6c09e'],['브라운','#76503b'],['카멜','#b88c57'],['오트밀','#d6ccb7'],['블루','#7897bb'],['소라','#a4c5df'],['청','#7897bb'],['그린','#607c55'],['카키','#777c53'],['머스타드','#c5a142'],['옐로우','#e3cb88'],['핑크','#dcb1bb'],['레드','#b44545'],['코랄','#d88678'],['러스트','#9c573b'],['버건디','#742d43'],['실버','#babbbc']];
  return (tones.find(([name])=>color.includes(name)) || ['','#bbb'])[1];
}
function dot(w) { return `<span class="color-dot" style="--swatch:${colorSwatch(w.color)}" aria-label="${esc(w.color)}"></span>`; }
function categoryName(w) {
  if(w.display_name) return w.display_name; const c=w.category.split('/').pop(); return ({'워크블루종':'블루종','라이더 자켓':'레더재킷','A라인 롱스커트':'롱스커트'})[c] || c; }
function material(w) {

function referenceMeta(r) {
  const matches=REF_MATCHES[refNumber(r)] || [];
  return r.desc.split('|').map(part=>{
    const [name,...value]=part.split(':'); let text=value.join(':').trim(); let html='';
    while(text.length){
      const candidates=matches.map(m=>({m,index:text.indexOf(m[0])})).filter(x=>x.index>=0).sort((a,b)=>a.index-b.index || b.m[0].length-a.m[0].length);
      if(!candidates.length){html+=esc(text);break;}
      const {m,index}=candidates[0];const w=itemById(m[1]);
      html+=esc(text.slice(0,index))+`<button class="ref-owned" onclick="openItem('${m[1]}')" aria-label="${esc(m[0]+' · '+m[1]+' 상세 보기')}" title="${esc(m[1]+' · '+w.color+' '+categoryName(w))}">${esc(m[0])}${m[2]?'<span class="match-state">대체 가능</span>':''}${m[2]?`<small class="match-difference">(${esc(m[2])})</small>`:''}</button>`;
      text=text.slice(index+m[0].length);
    }
    return `<div class="ref-line"><b>${esc(name.trim())}:</b><span>${html}</span></div>`;
  }).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function wardrobeCategory(w) {
  const [main,c]=w.category.split('/');
  if(main==='악세잡화') return /백|짐색/.test(c)?'가방':/비니|볼캡/.test(c)?'모자':'패션소품';
  if(main==='상의' && /가디건|후드집업|^집업$|셔츠자켓/.test(c)) return '아우터';
  if(main==='원피스' && c==='점프슈트') return '바지';
  if(main==='원피스' || main==='치마') return '원피스/스커트';
  return main;
}
function subtype(w) {
  const [main,c]=w.category.split('/');const category=wardrobeCategory(w);
  if(category==='상의') {
    if(c.includes('니트')||c.includes('스웨터')) return '니트/스웨터';
    if(c.includes('폴로')||c.includes('피케')) return '피케/카라 티셔츠';
    if(c==='후드') return '후드 티셔츠';
    if(c.includes('셔츠')&&!c.includes('티셔츠')) return '셔츠/블라우스';
    if(c.includes('민소매')||c.includes('캐미솔')) return '민소매 티셔츠';
    if(c.includes('반소매')||c==='로고 티셔츠') return '반소매 티셔츠';
    return '긴소매 티셔츠';
  }
  if(category==='아우터') {
    if(c.includes('가디건')) return '카디건';
    if(c==='후드집업') return '후드 집업';
    if(c==='집업') return '트레이닝 재킷';
    if(c.includes('셔츠자켓')) return '기타 아우터';
    if(c.includes('블레이저')||c==='수트') return '슈트/블레이저 재킷';
    if(c.includes('무스탕')) return '무스탕/퍼';
    if(c.includes('라이더')) return '레더/라이더스 재킷';
    if(c.includes('트러커')) return '트러커 재킷';
    if(c.includes('블루종')) return '블루종/MA-1';
    if(c.includes('스타디움')) return '스타디움 재킷';
    if(c.includes('야상')) return '사파리/헌팅 재킷';
    if(c.includes('조끼')) return '경량 패딩/패딩 베스트';
    if(c.includes('롱패딩')) return '롱패딩/헤비 아우터';
    if(c.includes('패딩')) return '숏패딩/헤비 아우터';
    if(c.includes('코트')) {
      if(!w.season.includes('겨울')||c.includes('트렌치')||c.includes('레인')) return '환절기 코트';
      if(w.desc_short.includes('더블')) return '겨울 더블 코트';
      if(c.includes('더플')||w.desc_short.includes('로브')) return '겨울 기타 코트';
      return '겨울 싱글 코트';
    }
    return '기타 아우터';
  }
  if(category==='바지') {
    if(c==='점프슈트') return '점프 슈트/오버올';
    if(/쇼츠|숏팬츠/.test(c)) return '숏 팬츠';
    if(/데님|진/.test(c)) return '데님 팬츠';
    if(c==='슬랙스') return '슈트 팬츠/슬랙스';
    if(c==='스웨트팬츠') return '트레이닝/조거 팬츠';
    return '기타 하의';
  }
  if(category==='원피스/스커트') {
    const length=garmentLength(w);
    if(main==='치마') return length.rank===0?'미니스커트':length.rank===1?'미디스커트':length.rank===2?'롱스커트':'스커트 · 기장 미확인';
    return c.includes('미니')?'미니원피스':c.includes('맥시')?'맥시원피스':'롱원피스';
  }
  return c;
}
function garmentLength(w) {
  if(w.length==='미디') return {rank:1,label:'미디'};
  if(w.length==='미니') return {rank:0,label:'미니'};
  if(w.length==='롱') return {rank:2,label:'롱'};
  const [main,c]=w.category.split('/');const text=c+' '+w.desc_short;
  if(/숏|쇼츠|미니|짧은 기장|크롭|반바지/.test(text)) return {rank:0,label:'짧은 기장'};
  if(/맥시|롱/.test(c)) return {rank:2,label:'긴 기장'};
  if(/미디|무릎 아래|엉덩이 (?:덮는|기장)|하프|반코트/.test(text)) return {rank:1,label:'중간 기장'};
  // 수치만 있는 총장, 소매 길이, 품목명만 있는 바지는 임의로 기장을 판단하지 않는다.
  return {rank:3,label:'기장 미확인'};
}
function colorRank(w) {
  const c=w.color.split(/[+\/(]/)[0];
  const ranks=[[/화이트/,0],[/아이보리|오트밀/,1],[/베이지|그레이지/,2],[/옐로우|머스타드/,3],[/러스트|코랄/,4],[/핑크/,5],[/레드|버건디/,6],[/그린|카키/,7],[/소라|스카이|라이트블루|삭스블루/,8],[/연청/,9],[/블루|청/,10],[/네이비/,11],[/카멜|브라운|모카/,12],[/그레이|회색|실버/,13],[/차콜/,14],[/블랙|검정/,15]];
  return (ranks.find(([re])=>re.test(c)) || [null,16])[1];
}
function renderWardrobe() {
  document.getElementById('wardrobe-guide').textContent=`옷장에 등록된 옷 ${WARDROBE.length}벌이에요. 눌러보시면 상세 정보가 나와요.`;
  document.getElementById('wardrobe-filter').innerHTML=['all',...WARDROBE_CATEGORIES].map(c=>`<button class="${c===wardrobeFilter?'active':''}" aria-pressed="${c===wardrobeFilter}" onclick="setFilter('${c}')">${c==='all'?'전체':c}</button>`).join('');
  const categoryList=WARDROBE.filter(w=>wardrobeFilter==='all'||wardrobeCategory(w)===wardrobeFilter);
  const subtypes=[...new Set(categoryList.map(subtype))];
  document.getElementById('wardrobe-subfilter').innerHTML=wardrobeFilter==='all'?'':['all',...subtypes].map(c=>`<button class="${c===wardrobeSubfilter?'active':''}" aria-pressed="${c===wardrobeSubfilter}" onclick="setSubfilter('${c}')">${c==='all'?'전체 종류':esc(c)}</button>`).join('');
  const query=document.getElementById('wardrobe-search').value.trim().toLocaleLowerCase();
  const list=categoryList.filter(w=>(wardrobeSubfilter==='all'||subtype(w)===wardrobeSubfilter)&&(!query||[w.id,categoryName(w),w.brand_en,w.color].join(' ').toLocaleLowerCase().includes(query))).sort((a,b)=>{
    if(wardrobeSort==='length') {
      const category=WARDROBE_CATEGORIES.indexOf(wardrobeCategory(a))-WARDROBE_CATEGORIES.indexOf(wardrobeCategory(b));
      return category || garmentLength(a).rank-garmentLength(b).rank || colorRank(a)-colorRank(b) || a.id.localeCompare(b.id);
    }
    return colorRank(a)-colorRank(b) || a.color.localeCompare(b.color,'ko') || garmentLength(a).rank-garmentLength(b).rank || a.id.localeCompare(b.id);
  });
  document.getElementById('wardrobe-count').textContent=wardrobeFilter==='all'?`총 ${WARDROBE.length}벌 · 현재 표시 ${list.length}벌`:`${wardrobeFilter}${wardrobeSubfilter==='all'?'':' · '+wardrobeSubfilter} ${list.length}벌`;
  document.getElementById('wardrobe-sort').value=wardrobeSort;
  document.getElementById('sort-guide').textContent=wardrobeSort==='length'?'같은 분류 안에서 짧은 → 중간 → 긴 기장 순 · 기장 미확인 품목은 마지막에 표시':'밝은 무채색 → 색상 계열 → 어두운 무채색 순';
  document.getElementById('wardrobe-grid').innerHTML=list.map(w=>itemCard(w,true)).join('');
}
function setFilter(c) { wardrobeFilter=c; wardrobeSubfilter='all'; renderWardrobe(); }
function setSubfilter(c) { wardrobeSubfilter=c; renderWardrobe(); }
function setWardrobeSort(value) { wardrobeSort=value; renderWardrobe(); }

function getRecords() {

}
function saveRecord() {
  const date = document.getElementById('rec-date').value;
  const look = document.getElementById('rec-look').value;
  if (!date || !look) { alert('날짜와 LOOK을 선택해주세요.'); return; }

  recs.push({date, look: parseInt(look), id: Date.now()});

function deleteRecord(id) {
  const recs = getRecords().filter(r => r.id !== id);
  localStorage.setItem('codi_records', JSON.stringify(recs));
  renderRecords();
}
function renderRecords() {
  const recs = getRecords().sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('record-count').textContent = `${recs.length} RECORDS`;
  document.getElementById('record-list').innerHTML = recs.map(r => {
    const look = LOOKS.find(l => l.num === r.look);
    const items = look ? look.items.map(id => {
      const w = itemById(id);
      return w ? `${w.id}(${w.category.split('/').pop()})` : id;
    }).join(' + ') : '';
    return `<div class="record-item">
      <div><b>${r.date}</b> — LOOK ${r.look}<div class="meta">${esc(items)}</div></div>
      <button class="btn-small" onclick="deleteRecord(${r.id})">삭제</button>
    </div>`;
  }).join('') || '<div class="empty"><strong>아직 기록이 없어요.</strong>날짜와 LOOK을 선택해 첫 코디 기록을 남겨보세요.</div>';
  document.getElementById('rec-date').value = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'});
}

// ===== 홈: 날씨 기반 추천 =====
const MONTH_AVG = [-3, -1, 5, 12, 18, 23, 26, 26, 21, 18, 7, 0];
let homeState = { temp: null, wxFailed: false, selected: null };

function getHomeTemp() {
  if (window._wx && window._wx.length) {
    // 인천 기준
    return window._wx[0].cur;
  }
  const m = new Date().getMonth();
  return MONTH_AVG[m];
}

function pickRecommendations(temp) {
  const avail = LOOKS.filter(l => !isDeleted(l.num) && l.temp_lo !== undefined);
  // 현재 기온이 범위에 들어가는 것 우선, 그 다음 가까운 순
  const scored = avail.map(l => {
    let score;
    if (temp >= l.temp_lo && temp <= l.temp_hi) score = 0;
    else score = Math.min(Math.abs(temp - l.temp_lo), Math.abs(temp - l.temp_hi));
    return { look: l, score };
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 3).map(s => s.look);
}

function renderHome() {
  const temp = getHomeTemp();
  homeState.temp = temp;
  const recs = pickRecommendations(temp);
  if (!homeState.selected || !recs.find(l => l.num === homeState.selected)) {
    homeState.selected = recs.length ? recs[0].num : null;
  }
  // 추천 카드
  document.getElementById('rec-cards').innerHTML = recs.map(l => {
    const imgs = l.items.filter(id => !id.startsWith('A')).slice(0, 4).map(id => {
      const w = itemById(id);
      if (!w) return '';
      return `<img src="${imgUrl(w.id)}" alt="${w.id}" loading="lazy" onerror="this.style.display='none'">`;
    }).join('');
    return `<button data-look="${l.num}" aria-pressed="${l.num === homeState.selected}" class="rec-card ${l.num === homeState.selected ? 'selected' : ''}" onclick="selectHomeLook(${l.num})">
      <div class="rec-imgs">${imgs}</div><div><div class="rec-num">LOOK ${l.num}</div><div class="rec-concept">${esc(lookTitle(l))}</div></div></button>`;
  }).join('');
  // 추천 서브타이틀 업데이트
  const subtitleEl = document.getElementById('rec-subtitle');
  if (subtitleEl) {
    subtitleEl.innerHTML = `<b>오늘 ${Math.round(temp)}°C</b> 추천 옵션 ${recs.length}개`;
  }
  renderBoard();
}

function selectHomeLook(num) {
  homeState.selected = num;
  document.querySelectorAll('.rec-card').forEach(c => {c.classList.remove('selected'); c.setAttribute('aria-pressed','false');});
  const cards = document.querySelectorAll('.rec-card');
  const recs = pickRecommendations(homeState.temp);
  const idx = recs.findIndex(l => l.num === num);
  if (idx >= 0 && cards[idx]) { cards[idx].classList.add('selected'); cards[idx].setAttribute('aria-pressed','true'); }
  renderBoard();
}

function renderBoard() {
  const look = LOOKS.find(l => l.num === homeState.selected);
  const canvas = document.getElementById('board-canvas');
  const numEl = document.getElementById('board-looknum');
  if (!look) { canvas.innerHTML = ''; numEl.textContent = ''; return; }
  const byCat = { O: [], T: [], D: [], B: [], A: [] };
  look.items.forEach(id => {
    const w = itemById(id);
    if (!w) return;
    const cat = id.charAt(0);
    if (byCat[cat]) byCat[cat].push(w);
  });
  let html = '';
  // 아우터 (상단 좌)
  byCat.O.slice(0, 1).forEach(w => {
    html += `<div class="board-item board-outer"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 상의 (상단 우)
  byCat.T.slice(0, 2).forEach((w, i) => {
    html += `<div class="board-item board-top" style="${i > 0 ? 'top:22%;' : ''}"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 원피스 (중앙, 상하의 대신)
  byCat.D.slice(0, 1).forEach(w => {
    html += `<div class="board-item board-bottom"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 하의 (하단)
  if (!byCat.D.length) byCat.B.slice(0, 1).forEach(w => {
    html += `<div class="board-item board-bottom"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 악세서리 (우측)
  byCat.A.slice(0, 2).forEach((w, i) => {
    html += `<div class="board-item ${i === 0 ? 'board-acc' : 'board-acc2'}"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  canvas.innerHTML = html;
  numEl.innerHTML = `<span>${esc(lookTitle(look))}</span><button class="btn-small copy-id" onclick="copyReference('LOOK ${look.num}',this)">LOOK ${look.num} · 번호 복사</button>`;
}

// Screen-specific presentation uses the same stable wardrobe and LOOK identifiers.
function seasonText(w){return w.seasons.length===4?'사계절':w.seasons.join('·');}
function garmentImage(w, extra='') {
  const b=IMAGE_LAYOUT[w.id] || [84,84,8,8];const target=w.id.startsWith('A')?.70:.84;const f=target/.84;
  const a=[b[0]*f,b[1]*f,50+(b[2]-50)*f,50+(b[3]-50)*f];
  return `<button class="item-image ${extra}" aria-label="${esc(w.id+' '+categoryName(w)+' 상세 보기')}" onclick="openItem('${w.id}')"><img src="${imgUrl(w.id)}" style="width:${a[0]}%;height:${a[1]}%;left:${a[2]}%;top:${a[3]}%" alt="${esc(w.color+' '+categoryName(w))}" loading="lazy"></button>`;
}
function itemCard(w){return `<div class="item-card">${garmentImage(w)}<div class="item-info"><div class="category-name">${esc(categoryName(w))}</div><div class="brand">${esc(w.brand_en)}</div><div class="detail">${esc(w.color)} · ${esc(seasonText(w))}</div><div class="item-title">${esc(w.id)} ${dot(w)}</div></div></div>`;}
function composition(l){return `<div class="look-composition" style="--item-count:${Math.min(4,l.items.length)}">${l.items.map(itemById).filter(Boolean).map(w=>`<div class="mini-item">${garmentImage(w)}<p>${esc(categoryName(w))}</p></div>`).join('')}</div>`;}
function openPanel(html){window.detailTrigger=document.activeElement;const box=document.getElementById('lightbox');document.getElementById('lightbox-img').hidden=true;document.getElementById('lightbox-caption').innerHTML=html;box.classList.add('open','panel-mode');document.body.style.overflow='hidden';document.querySelector('.lb-close').focus();}
function openItem(id){const w=itemById(id);if(!w)return;const length=garmentLength(w);const related=LOOKS.filter(l=>!isDeleted(l.num)&&l.items.includes(id));
  const rows=[['분류',wardrobeCategory(w)+' / '+subtype(w)],['브랜드',w.brand_en||'미확인'],['색상',w.color],['패턴',w.pattern||'미확인'],['소재',w.material||'미확인'],['계절',seasonText(w)]];
  if(!w.id.startsWith('A'))rows.push(['기장',length.label],['소매',w.sleeve||'미확인'],['핏',w.fit||'미확인'],['실루엣',w.silhouette||'미확인']);
  openPanel(`<h2>${esc(categoryName(w))}</h2><p class="detail-subtext">${esc(w.id)}</p><img class="detail-image" src="${imgUrl(id)}" alt="${esc(categoryName(w))}"><dl class="detail-meta">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="detail-section"><h3>상세 설명</h3><p>${esc(w.desc_short)}</p></div><button class="btn-small" onclick="copyReference('${id}',this)">${id} · 번호 복사</button><div class="detail-section"><h3>이 옷을 사용한 코디</h3>${related.map(l=>`<button class="detail-link" onclick="openLook(${l.num})">LOOK ${l.num} · ${esc(lookTitle(l))}</button>`).join('')||'<p>연결된 코디가 없어요.</p>'}</div>`);}
function lookSummary(l){const t=l.reason||l.note||'';return t.split(/(?<=[.!?。])\s/)[0]||'보유한 옷으로 구성한 코디예요.';}
function temperatureText(l){return Number.isFinite(l.temp_lo)&&Number.isFinite(l.temp_hi)?`참고 ${l.temp_lo}–${l.temp_hi}°C`:'참고 온도 미설정';}
function outfitCard(l){return `<article class="look-card" id="look-${l.num}"><div class="look-topline"><h3 class="look-title">${esc(lookTitle(l))}</h3></div><div class="look-tags">${getLookSeasons(l).map(x=>`<span>${x}</span>`).join('')}<span class="temp-badge">${temperatureText(l)}</span></div>${composition(l)}<p class="look-note">${esc(lookSummary(l))}</p><footer class="card-footer"><div class="detail-subtext">LOOK ${l.num}</div><div class="look-actions"><button class="btn-board" onclick="openLook(${l.num})">상세 보기</button><button class="btn-board" onclick="recordLook(${l.num})">착용 기록</button><details class="look-more"><summary aria-label="LOOK ${l.num} 더 보기">•••</summary><button onclick="deleteLook(${l.num})">코디 삭제</button></details></div></footer></article>`;}
function openLook(num){const l=LOOKS.find(x=>x.num===num);if(!l)return;const ref=STYLE_REFS.find(r=>'style-refs/'+r.file===l.ref_img);
 openPanel(`<h2>${esc(lookTitle(l))}</h2><p class="detail-subtext">LOOK ${num} · ${getLookSeasons(l).join('·')} · ${temperatureText(l)}</p>${composition(l)}<div class="detail-section"><h3>스타일링 포인트</h3><p>${esc(l.reason||l.note||'')}</p></div><div class="panel-actions"><button class="btn-board" onclick="recordLook(${num})">이 코디 착용 기록</button><button class="btn-small" onclick="copyReference('LOOK ${num}',this)">LOOK ${num} · 번호 복사</button><button class="btn-small" onclick="closeLightbox();showBoard(${num})">스타일링 보드 보기</button></div>${l.ref_img?`<div class="detail-section"><h3>${ref?'REF '+refNumber(ref):'착장'} 레퍼런스</h3><img class="detail-reference" src="${esc(l.ref_img)}" alt="착장 레퍼런스">${ref?`<div class="ref-info">${referenceMeta(ref)}</div>`:''}</div>`:''}`);}
function showToast(message,action,label='되돌리기'){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');const span=document.createElement('span');span.textContent=message;t.append(span);if(action){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{action();t.remove();};t.append(b);}document.body.append(t);setTimeout(()=>t.remove(),10000);}
function deleteLook(num){const before=getDeleted();if(!before.includes(num))localStorage.setItem('codi_deleted',JSON.stringify([...before,num]));renderOutfits();renderHome();renderRefs();showToast('코디를 목록에서 삭제했어요.',()=>{localStorage.setItem('codi_deleted',JSON.stringify(getDeleted().filter(x=>x!==num)));renderOutfits();renderHome();renderRefs();});}
function recordLook(num){if(document.getElementById('lightbox').classList.contains('open'))closeLightbox();switchTab('records');document.getElementById('rec-date').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});document.getElementById('rec-look').value=String(num);document.getElementById('rec-note').value='';renderRecordPreview();document.getElementById('tab-records').scrollIntoView({block:'start'});}
function renderRecordPreview(){const l=LOOKS.find(x=>x.num===Number(document.getElementById('rec-look').value));document.getElementById('record-preview').innerHTML=l?`<div class="record-preview"><h3>${esc(lookTitle(l))}</h3>${composition(l)}</div>`:'';}
function getRecords(){try{const data=JSON.parse(localStorage.getItem('codi_records')||'[]');return Array.isArray(data)?data:[];}catch{return [];}}
function saveRecord(){const date=document.getElementById('rec-date').value;const num=Number(document.getElementById('rec-look').value);const look=LOOKS.find(l=>l.num===num);if(!date||!look){showToast('날짜와 코디를 선택해주세요.');return;}const recs=getRecords();recs.push({date,look:num,id:Date.now()+Math.random(),note:document.getElementById('rec-note').value.trim(),title:lookTitle(look),items:[...look.items]});localStorage.setItem('codi_records',JSON.stringify(recs));renderRecords();showToast('착용 기록을 저장했어요.');}
function renderRecords(){const recs=getRecords().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('record-count').textContent=`기록 ${recs.length}개`;document.getElementById('record-list').innerHTML=recs.map(r=>{const l=LOOKS.find(x=>x.num===r.look);const snapshot={items:r.items||l?.items||[]};return `<div class="record-item"><div class="record-thumbnail">${composition(snapshot)}</div><div class="record-content"><b>${esc(r.date)}</b><h3>${esc(r.title|| (l?lookTitle(l):'저장된 코디'))}</h3><p>${esc(r.note||'')}</p><button class="btn-small" onclick="openLook(${r.look})">LOOK ${r.look} 상세</button></div><button class="btn-small" onclick="deleteRecord(${r.id})">삭제</button></div>`;}).join('')||'<div class="empty"><strong>아직 기록이 없어요.</strong>홈이나 코디 상세에서 착용 기록을 남겨보세요.</div>';if(!document.getElementById('rec-date').value)document.getElementById('rec-date').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});}
function deleteRecord(id){const records=getRecords();const removed=records.find(r=>r.id===id);localStorage.setItem('codi_records',JSON.stringify(records.filter(r=>r.id!==id)));renderRecords();showToast('기록을 삭제했어요.',()=>{if(removed)localStorage.setItem('codi_records',JSON.stringify([...getRecords(),removed]));renderRecords();});}
function exportRecords(){const blob=new Blob([JSON.stringify({version:1,records:getRecords()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='codi-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importRecords(input){const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const rows=Array.isArray(data)?data:data.records;if(!Array.isArray(rows)||rows.length>10000)throw Error();const cleaned=rows.map(r=>{if(typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!Number.isInteger(r.look)||!LOOKS.some(l=>l.num===r.look)||typeof r.id!=='number'||!Number.isFinite(r.id))throw Error();return {date:r.date,look:r.look,id:r.id,note:String(r.note||'').slice(0,300),title:String(r.title||'').slice(0,200),items:Array.isArray(r.items)?r.items.filter(id=>typeof id==='string'&&itemById(id)):undefined};});const current=getRecords();const keys=new Set(current.map(r=>r.id));const additions=cleaned.filter(r=>{if(keys.has(r.id))return false;keys.add(r.id);return true;});localStorage.setItem('codi_records',JSON.stringify([...current,...additions]));renderRecords();showToast(`${additions.length}개 기록을 가져왔어요.`);}catch{showToast('기록 파일 형식을 확인해주세요.');}input.value='';}
function currentSeason(){const month=Number(new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}).slice(5,7));return month>=3&&month<=5?'봄':month>=6&&month<=8?'여름':month>=9&&month<=11?'가을':'겨울';}
function recommendationScore(l,temp,basis){const wx=window._wx?.[0];const lo=basis==='daily'&&wx?wx.min:temp;const hi=basis==='daily'&&wx?wx.max:temp;const gap=x=>x<l.temp_lo?l.temp_lo-x:x>l.temp_hi?x-l.temp_hi:0;const recent=getRecords().filter(r=>{const days=(Date.now()-new Date(r.date+'T00:00:00+09:00').getTime())/86400000;return days>=0&&days<7;}).some(r=>r.look===l.num);return gap(lo)+gap(hi)+(getLookSeasons(l).includes(currentSeason())?0:4)+(recent?3:0);}
function pickRecommendations(temp){const basis=document.getElementById('weather-basis').value;const avail=LOOKS.filter(l=>!isDeleted(l.num));if(!window._wx?.length)return avail.filter(l=>getLookSeasons(l).includes(currentSeason())).slice(0,3);const scored=avail.filter(l=>Number.isFinite(l.temp_lo)&&Number.isFinite(l.temp_hi)).map(l=>({l,score:recommendationScore(l,temp,basis)})).sort((a,b)=>a.score-b.score||a.l.num-b.l.num);const picks=[];while(scored.length&&picks.length<3){scored.sort((a,b)=>(a.score+picks.reduce((sum,p)=>sum+p.items.filter(id=>!id.startsWith('A')&&a.l.items.includes(id)).length,0)*.5)-(b.score+picks.reduce((sum,p)=>sum+p.items.filter(id=>!id.startsWith('A')&&b.l.items.includes(id)).length,0)*.5));picks.push(scored.shift().l);}return picks;}
function renderHome(){homeState.temp=getHomeTemp();const recs=pickRecommendations(homeState.temp);if(!recs.some(l=>l.num===homeState.selected))homeState.selected=recs[0]?.num||null;document.getElementById('rec-cards').innerHTML=recs.map(l=>`<button data-look="${l.num}" aria-pressed="${l.num===homeState.selected}" class="rec-card ${l.num===homeState.selected?'selected':''}" onclick="selectHomeLook(${l.num})"><div class="rec-imgs">${l.items.filter(id=>!id.startsWith('A')).slice(0,3).map(id=>garmentImage(itemById(id)).replace(/<button[^>]*>/,'<span class="item-image">').replace('</button>','</span>')).join('')}</div><div><div class="rec-num">LOOK ${l.num}</div><div class="rec-concept">${esc(lookTitle(l))}</div></div></button>`).join('');document.getElementById('rec-subtitle').textContent=window._wx?.length?(document.getElementById('weather-basis').value==='daily'?'오늘 최저·최고 기준':'현재 '+Math.round(homeState.temp)+'° 기준'):`${currentSeason()} 코디`;document.querySelector('.home-guide').textContent=window._wx?.length?'기온·계절·최근 7일 착용과 조합 다양성을 고려했어요.':'날씨 대신 현재 계절의 코디를 보여드려요.';renderBoard();}
function renderBoard(){const l=LOOKS.find(x=>x.num===homeState.selected);if(!l){document.getElementById('board-canvas').innerHTML='추천할 코디가 없어요.';document.getElementById('board-looknum').innerHTML='';return;}let outer=0,top=0,bottom=0,acc=0;document.getElementById('board-canvas').innerHTML=l.items.map(itemById).filter(Boolean).map(w=>{const cat=wardrobeCategory(w);let cls,pos='';if(w.id.startsWith('A')){cls=acc++?'board-acc2':'board-acc';}else if(cat==='아우터'&&outer++===0){cls='board-outer';}else if(cat==='상의'||cat==='아우터'){cls='board-top';if(top++)pos='top:23%;';}else{cls='board-bottom';if(bottom++)pos='left:48%;';}return `<div class="board-item ${cls}" style="${pos}">${garmentImage(w,'garment-image')}</div>`;}).join('');document.getElementById('board-looknum').innerHTML=`<strong>${esc(lookTitle(l))}</strong><p class="recommendation-reason">${window._wx?.length?esc(temperatureText(l))+' · '+getLookSeasons(l).join('·'):currentSeason()+'에 입는 보유 코디'}</p><div class="panel-actions"><button class="btn-board" onclick="recordLook(${l.num})">오늘 입었어요</button><button class="btn-small" onclick="openLook(${l.num})">코디 상세</button><button class="btn-small" onclick="copyReference('LOOK ${l.num}',this)">LOOK ${l.num} · 번호 복사</button></div>`;}
let refFilter='all';
function setRefFilter(value){refFilter=value;renderRefs();}
function refStatus(r){if(transferredLook(r))return 'moved';const matches=REF_MATCHES[refNumber(r)]||[];if(matches.some(m=>m[2]))return 'alternative';if(matches.length)return 'owned';return 'none';}
function renderRefs(){const candidates=STYLE_REFS.filter(r=>refFilter==='moved'?refStatus(r)==='moved':refStatus(r)!=='moved');const list=candidates.filter(r=>{const matches=REF_MATCHES[refNumber(r)]||[];if(refFilter==='owned')return matches.some(m=>!m[2]);if(refFilter==='alternative')return matches.some(m=>m[2]);return true;});document.getElementById('ref-filter').innerHTML=[['all','전체'],['owned','보유품 연결'],['alternative','대체 가능'],['moved','코디로 옮긴 레퍼런스']].map(([v,t])=>`<button class="${refFilter===v?'active':''}" aria-pressed="${refFilter===v}" onclick="setRefFilter('${v}')">${t}</button>`).join('');document.getElementById('ref-count').textContent=`레퍼런스 ${list.length}개`;document.getElementById('ref-move-note').textContent='코디로 옮긴 원본은 별도 필터에서 확인할 수 있어요. 코디를 삭제하면 원본은 기본 목록으로 돌아옵니다.';document.getElementById('ref-grid').innerHTML=list.map(r=>{const moved=transferredLook(r);return `<article class="ref-card"><img src="style-refs/${r.file}" alt="${esc(r.desc)}" loading="lazy" onclick="openLightbox(this.src,this.alt)" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="ref-missing" hidden>원본 이미지가 없습니다.</div><div class="ref-info">${referenceMeta(r)}</div><footer class="card-footer ref-actions">${moved?`<button class="detail-link" onclick="openLook(${moved.num})">LOOK ${moved.num} 코디 보기</button>`:''}<button class="btn-small ref-id" onclick="copyReference('REF ${refNumber(r)}',this)">REF ${refNumber(r)} · 번호 복사</button></footer></article>`;}).join('')||'<div class="empty">이 조건의 레퍼런스가 없어요.</div>';}

function chooseRecordLook(){openPanel(`<h2>입은 코디 선택</h2><div class="look-grid">${LOOKS.filter(l=>!isDeleted(l.num)).map(l=>`<article class="look-card"><h3 class="look-title">${esc(lookTitle(l))}</h3>${composition(l)}<button class="detail-link" onclick="selectRecordLook(${l.num})">LOOK ${l.num} 선택</button></article>`).join('')}</div>`);}
function selectRecordLook(num){closeLightbox();document.getElementById('rec-look').value=String(num);renderRecordPreview();}
// ===== 초기화 =====
(function() {
  const d = new Date(new Date().toLocaleString('en-US', {timeZone:'Asia/Seoul'}));
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('home-date').textContent =
    `TODAY · ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
})();
loadWeather();
renderOutfits();
renderWardrobe();
renderRecords();
renderRefs();
renderHome();
renderRecordPreview();
</script>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="아이템 상세" onclick="if(event.target===this)closeLightbox()"><button class="lb-close" aria-label="닫기" onclick="closeLightbox()">×</button>
  <img id="lightbox-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="확대 이미지">
  <div class="lb-caption" id="lightbox-caption"></div>
</div>
<script>
function openLightbox(src, caption) {
  window.detailTrigger=document.activeElement;
  document.getElementById('lightbox').classList.remove('panel-mode');
  document.getElementById('lightbox-img').hidden=false;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = caption || '';
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('panel-mode');
  document.getElementById('lightbox-img').hidden=false;
  if(window.detailTrigger) window.detailTrigger.focus();
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
 const box=document.getElementById('lightbox');if(!box.classList.contains('open'))return;
 if(e.key==='Escape')closeLightbox();
 if(e.key==='Tab'){const targets=[...box.querySelectorAll('button,a[href],input,select,textarea,summary')].filter(el=>el.getClientRects().length);const first=targets[0],last=targets[targets.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
});
</script>
</body>
