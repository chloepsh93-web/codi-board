<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코디 보드</title>
<style>
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #888;
  --border: #e8e8e8;
  --accent: #1a1a1a;
  --danger: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
.weather { font-size: 13px; color: var(--muted); text-align: right; }
.weather b { color: var(--text); }
nav.tabs {
  max-width: 1200px; margin: 0 auto;
  display: flex; padding: 0 20px;
  border-top: 1px solid var(--border);
}
nav.tabs button {
  background: none; border: none;
  padding: 14px 20px;
  font-size: 15px; font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
nav.tabs button.active {
  color: #000;
  border-bottom-color: #000;
}
nav.tabs button.sub { color: #aaa; font-weight: 400; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 홈 */
/* 홈 - 날씨 */
.home-weather { display: flex; gap: 32px; margin: 8px 0 4px; }
.wx-city .wx-name { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
.wx-city .wx-temp { font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -1px; }
.wx-city .wx-minmax { font-size: 12px; color: var(--muted); }
.home-guide { font-size: 14px; color: var(--muted); margin: 12px 0 24px; }
.home-date { font-size: 13px; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; }

/* 홈 - 추천 카드 */
.rec-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
.rec-card { background: #fff; border: 1px solid var(--border); cursor: pointer; padding: 0; text-align: left; }
.rec-card.selected { border: 2px solid #1a1a1a; }
.rec-card .rec-num { font-size: 12px; letter-spacing: 1px; color: var(--muted); padding: 12px 12px 0; }
.rec-card .rec-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 8px 12px; }
.rec-card .rec-imgs img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; }
.rec-card .rec-concept { font-size: 13px; font-weight: 600; padding: 0 12px 12px; }

/* 홈 - 스타일링 보드 */
.style-board { background: #fff; border: 1px solid var(--border); padding: 32px; margin-bottom: 40px; }
.style-board h2 { font-size: 18px; letter-spacing: 3px; font-weight: 700; margin-bottom: 24px; text-align: center; }
.board-canvas { position: relative; min-height: 480px; max-width: 600px; margin: 0 auto; }
.board-item { position: absolute; }
.board-item img { width: 100%; height: auto; object-fit: contain; display: block; }
/* 배치: 아우터 상단, 상의 중단, 하의 하단, 악세서리 우측 */
.board-outer { top: 0; left: 8%; width: 42%; }
.board-top { top: 4%; left: 52%; width: 32%; }
.board-bottom { top: 48%; left: 18%; width: 44%; }
.board-acc { top: 52%; right: 6%; width: 18%; }
.board-acc2 { top: 68%; right: 8%; width: 15%; }
.board-looknum { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-top: 16px; }
@media (max-width: 640px) {
  .rec-cards { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .board-canvas { min-height: 380px; }
  .wx-city .wx-temp { font-size: 36px; }
}
.hero { margin-bottom: 32px; }
.hero h2 { font-size: 22px; margin-bottom: 8px; letter-spacing: 1px; }
/* today-look: 스타일링 보드로 대체됨 */

/* 코디 카드 */
.look-grid { display: flex; flex-direction: column; gap: 32px; }
.look-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 20px;
  display: flex; gap: 20px; align-items: flex-start;
}
.look-num {
  font-size: 13px; color: var(--muted);
  letter-spacing: 1px; margin-bottom: 12px;
}
.look-ref { flex-shrink: 0; width: 220px; }
.look-ref img {
  width: 100%; aspect-ratio: 3/4; object-fit: cover;
  background: #f0f0f0;
}
.look-items {
  display: flex; gap: 12px; flex-wrap: wrap;
  align-items: flex-start;
}
.item-card { width: 140px; text-align: left; }
.item-card img {
  width: 100%; aspect-ratio: 1/1; object-fit: contain;
  background: #fff;
  border: 1px solid var(--border);
}
.item-info { padding: 8px 0; font-size: 12px; }
.item-info .brand { font-weight: 600; }
.item-info .detail { color: var(--muted); }
.item-info .id { color: #bbb; font-size: 11px; }
.look-actions { margin-top: 12px; }
.btn-delete {
  background: none;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  border-radius: 0;
}
.btn-delete:hover { background: var(--danger); color: #fff; }
.look-note {
  margin-top: 8px; font-size: 12px; color: var(--muted);
  font-style: italic;
}

/* 옷장 */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.filter-bar button {
  background: var(--card); border: 1px solid var(--border);
  padding: 8px 16px; font-size: 13px; cursor: pointer;
  color: var(--muted);
}
.filter-bar button.active { background: #000; color: #fff; border-color: #000; }
.wardrobe-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
.wardrobe-count { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

/* 기록 */
.record-form {
  background: var(--card); border: 1px solid var(--border);
  padding: 20px; margin-bottom: 24px;
}
.record-form select, .record-form input {
  padding: 8px 12px; font-size: 14px;
  border: 1px solid var(--border); margin-right: 8px;
}
.btn-primary {
  background: #000; color: #fff; border: none;
  padding: 10px 20px; font-size: 14px; cursor: pointer;
}
.record-list { display: flex; flex-direction: column; gap: 12px; }
.record-item {
  background: var(--card); border: 1px solid var(--border);
  padding: 16px; display: flex; justify-content: space-between; align-items: center;
}
.record-item .meta { font-size: 13px; color: var(--muted); }
.btn-small {
  background: none; border: 1px solid var(--border);
  padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--muted);
}
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }

/* 스타일 레퍼런스 */
.ref-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}
.ref-card { background: var(--card); border: 1px solid var(--border); }
.ref-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
.ref-info { padding: 12px; font-size: 12px; }
.ref-info .hl { color: #b8860b; font-weight: 600; }

@media (max-width: 768px) {
  .look-card { flex-direction: column; }
  .look-ref { width: 100%; max-width: 300px; }
}

/* 라이트박스 (이미지 클릭 확대) */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 8px; }
.lightbox .lb-caption { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: #fff; font-size: 15px; }
.item-card img { cursor: zoom-in; }
.look-ref img { cursor: zoom-in; }
</style>
</head>

<header>
  <div class="header-inner">
    <div class="logo">CODI BOARD</div>
    <div class="weather" id="weather">날씨 불러오는 중...</div>
  </div>
  <nav class="tabs">
    <button class="active" data-tab="home">홈</button>
    <button data-tab="outfits">코디 조합</button>
    <button data-tab="wardrobe">옷장</button>
    <button data-tab="records">기록</button>
    <button data-tab="refs">스타일 레퍼런스</button>
  </nav>
</header>
<main>
  <section id="tab-home" class="tab-panel active">
    <div class="home-date" id="home-date"></div>
    <div class="home-weather" id="home-weather"></div>
    <p class="home-guide">오늘 날씨에 맞는 코디를 추천해드려요.</p>
    <div class="rec-cards" id="rec-cards"></div>
    <div class="style-board" id="style-board">
      <h2>TODAY'S LOOK</h2>
      <div class="board-canvas" id="board-canvas"></div>
      <div class="board-looknum" id="board-looknum"></div>
    </div>
  </section>
  <section id="tab-outfits" class="tab-panel">
    <div class="look-grid" id="outfit-list"></div>
  </section>
  <section id="tab-wardrobe" class="tab-panel">
    <div class="wardrobe-count" id="wardrobe-count"></div>
    <div class="filter-bar" id="wardrobe-filter"></div>
    <div class="wardrobe-grid" id="wardrobe-grid"></div>
  </section>
  <section id="tab-records" class="tab-panel">
    <div class="record-form">
      <input type="date" id="rec-date">
      <select id="rec-look"></select>
      <button class="btn-primary" onclick="saveRecord()">기록 저장</button>
    </div>
    <div class="record-list" id="record-list"></div>
  </section>
  <section id="tab-refs" class="tab-panel">
    <div class="ref-grid" id="ref-grid"></div>
  </section>
</main>

// ===== 날씨 (open-meteo 직접 호출) =====
async function loadWeather() {
  const spots = [
    {name: '인천', lat: 37.4563, lon: 126.7052},
    {name: '서울', lat: 37.5665, lon: 126.9780}
  ];
  try {
    const results = await Promise.all(spots.map(async s => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=Asia%2FSeoul`;
      const r = await fetch(url);
      const j = await r.json();
      const cur = j.current.temperature_2m;
      const max = j.daily.temperature_2m_max[0];
      const min = j.daily.temperature_2m_min[0];
      return {name: s.name, cur, max, min};
    }));
    const html = results.map(r => `${r.name} <b>${r.cur}°C</b>`).join(' &nbsp;|&nbsp; ');
    document.getElementById('weather').innerHTML = html;
    // 홈 날씨 영역 (4-3: 현재 기온 크게, 최저최고 작게)
    document.getElementById('home-weather').innerHTML = results.map(r =>
      `<div class="wx-city"><div class="wx-name">${r.name}</div>` +
      `<div class="wx-temp">${r.cur}°</div>` +
      `<div class="wx-minmax">${r.min}° / ${r.max}°</div></div>`
    ).join('');
    // 전역 저장 (보고용)
    window._wx = results;
    renderHome();
  } catch(e) {
    document.getElementById('weather').textContent = '날씨 정보 없음';
    // SPEC 8: 실패 시 월평균 기온으로 추천 유지
    const m = new Date().getMonth();
    const avg = MONTH_AVG[m];
    document.getElementById('home-weather').innerHTML =
      `<div class="wx-city"><div class="wx-name">날씨 불러오기 실패</div>` +
      `<div class="wx-temp" style="font-size:28px">${avg}°</div>` +
      `<div class="wx-minmax">${m + 1}월 평균 기온 기준 추천</div></div>`;
    window._wx = [{ name: '평균', cur: avg, max: avg, min: avg }];
    renderHome();
  }
}

// 기존 보드에서 삭제된 LOOK 초기값 (서버 board_preferences 기준)
const SEED_DELETED = [35, 44, 72, 74, 76, 78];
function getDeleted() {
  const raw = localStorage.getItem('codi_deleted');
  if (raw === null) {
    localStorage.setItem('codi_deleted', JSON.stringify(SEED_DELETED));
    return [...SEED_DELETED];
  }
  return JSON.parse(raw);
}
function isDeleted(num) {
  return getDeleted().includes(num);
}
function deleteLook(num) {
  if (!confirm(`LOOK ${num}을(를) 삭제할까요?`)) return;
  const d = getDeleted();
  d.push(num);
  localStorage.setItem('codi_deleted', JSON.stringify(d));
  renderOutfits();
}

// ===== 코디 렌더링 =====
function itemById(id) {
  return WARDROBE.find(w => w.id === id);
}
function renderOutfits() {
  const el = document.getElementById('outfit-list');
  const visible = LOOKS.filter(l => !isDeleted(l.num));
  el.innerHTML = visible.map(l => {
    const refImg = l.ref_img
      ? `<div class="look-ref"><img src="${l.ref_img}" alt="레퍼런스" loading="lazy" onclick="openLightbox(this.src, '레퍼런스')"></div>`
      : '';
    const items = l.items.map(id => {
      const w = itemById(id);
      if (!w) return '';
      return `<div class="item-card">
        <img src="${imgUrl(w.id)}" alt="${w.id}" loading="lazy" onerror="this.style.display='none'" onclick="openLightbox(this.src, '${w.id}')">
        <div class="item-info">
          <div class="brand">${esc(w.brand_en || '-')}</div>
          <div class="detail">${esc(w.color)} · ${esc(w.desc_short || '')}</div>
          <div class="detail">${esc(w.season)} · ${esc(w.fit || '')}${w.temp ? ' · ' + esc(w.temp) : ''}</div>
          <div class="id">${w.id}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="look-card" id="look-${l.num}">
      <div style="flex:1">
        <div class="look-num">LOOK ${l.num}</div>
        <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
          ${refImg}
          <div class="look-items">${items}</div>
        </div>
        ${l.note ? `<div class="look-note">${esc(l.note)}</div>` : ''}
        <div class="look-actions"><button class="btn-delete" onclick="deleteLook(${l.num})">코디 삭제</button></div>
      </div>
    </div>`;
  }).join('') || '<div class="empty">표시할 코디가 없습니다.</div>';

  // 기록용 select
  const sel = document.getElementById('rec-look');
  sel.innerHTML = visible.map(l => `<option value="${l.num}">LOOK ${l.num}</option>`).join('');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 기록 (localStorage) =====
function getRecords() {
  return JSON.parse(localStorage.getItem('codi_records') || '[]');
}
function saveRecord() {
  const date = document.getElementById('rec-date').value;
  const look = document.getElementById('rec-look').value;
  if (!date || !look) { alert('날짜와 LOOK을 선택해주세요.'); return; }
  const recs = getRecords();
  recs.push({date, look: parseInt(look), id: Date.now()});
  localStorage.setItem('codi_records', JSON.stringify(recs));
  renderRecords();
}
function deleteRecord(id) {
  const recs = getRecords().filter(r => r.id !== id);
  localStorage.setItem('codi_records', JSON.stringify(recs));
  renderRecords();
}
function renderRecords() {
  const recs = getRecords().sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('record-list').innerHTML = recs.map(r => {
    const look = LOOKS.find(l => l.num === r.look);
    const items = look ? look.items.map(id => {
      const w = itemById(id);
      return w ? `${w.id}(${w.category.split('/').pop()})` : id;
    }).join(' + ') : '';
    return `<div class="record-item">
      <div><b>${r.date}</b> — LOOK ${r.look}<div class="meta">${esc(items)}</div></div>
      <button class="btn-small" onclick="deleteRecord(${r.id})">삭제</button>
    </div>`;
  }).join('') || '<div class="empty">기록이 없습니다.</div>';
  document.getElementById('rec-date').value = new Date().toISOString().slice(0,10);
}

// ===== 홈: 날씨 기반 추천 =====
const MONTH_AVG = [-3, -1, 5, 12, 18, 23, 26, 26, 21, 18, 7, 0];
let homeState = { temp: null, wxFailed: false, selected: null };

function getHomeTemp() {
  if (window._wx && window._wx.length) {
    // 인천 기준
    return window._wx[0].cur;
  }
  const m = new Date().getMonth();
  return MONTH_AVG[m];
}

function pickRecommendations(temp) {
  const avail = LOOKS.filter(l => !isDeleted(l.num) && l.temp_lo !== undefined);
  // 현재 기온이 범위에 들어가는 것 우선, 그 다음 가까운 순
  const scored = avail.map(l => {
    let score;
    if (temp >= l.temp_lo && temp <= l.temp_hi) score = 0;
    else score = Math.min(Math.abs(temp - l.temp_lo), Math.abs(temp - l.temp_hi));
    return { look: l, score };
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 3).map(s => s.look);
}

function renderHome() {
  const temp = getHomeTemp();
  homeState.temp = temp;
  const recs = pickRecommendations(temp);
  if (!homeState.selected || !recs.find(l => l.num === homeState.selected)) {
    homeState.selected = recs.length ? recs[0].num : null;
  }
  // 추천 카드
  document.getElementById('rec-cards').innerHTML = recs.map(l => {
    const imgs = l.items.filter(id => !id.startsWith('A')).slice(0, 4).map(id => {
      const w = itemById(id);
      if (!w) return '';
      return `<img src="${imgUrl(w.id)}" alt="${w.id}" loading="lazy" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox(this.src,'${w.id}')">`;
    }).join('');
    return `<div class="rec-card ${l.num === homeState.selected ? 'selected' : ''}" onclick="selectHomeLook(${l.num})">
      <div class="rec-num">LOOK ${l.num}</div>
      <div class="rec-imgs">${imgs}</div>
      <div class="rec-concept">${esc(l.concept || '')}</div>
    </div>`;
  }).join('');
  renderBoard();
}

function selectHomeLook(num) {
  homeState.selected = num;
  document.querySelectorAll('.rec-card').forEach(c => c.classList.remove('selected'));
  const cards = document.querySelectorAll('.rec-card');
  const recs = pickRecommendations(homeState.temp);
  const idx = recs.findIndex(l => l.num === num);
  if (idx >= 0 && cards[idx]) cards[idx].classList.add('selected');
  renderBoard();
}

function renderBoard() {
  const look = LOOKS.find(l => l.num === homeState.selected);
  const canvas = document.getElementById('board-canvas');
  const numEl = document.getElementById('board-looknum');
  if (!look) { canvas.innerHTML = ''; numEl.textContent = ''; return; }
  const byCat = { O: [], T: [], D: [], B: [], A: [] };
  look.items.forEach(id => {
    const w = itemById(id);
    if (!w) return;
    const cat = id.charAt(0);
    if (byCat[cat]) byCat[cat].push(w);
  });
  let html = '';
  // 아우터 (상단 좌)
  byCat.O.slice(0, 1).forEach(w => {
    html += `<div class="board-item board-outer"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 상의 (상단 우)
  byCat.T.slice(0, 2).forEach((w, i) => {
    html += `<div class="board-item board-top" style="${i > 0 ? 'top:22%;' : ''}"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 원피스 (중앙, 상하의 대신)
  byCat.D.slice(0, 1).forEach(w => {
    html += `<div class="board-item board-bottom"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 하의 (하단)
  if (!byCat.D.length) byCat.B.slice(0, 1).forEach(w => {
    html += `<div class="board-item board-bottom"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  // 악세서리 (우측)
  byCat.A.slice(0, 2).forEach((w, i) => {
    html += `<div class="board-item ${i === 0 ? 'board-acc' : 'board-acc2'}"><img src="${imgUrl(w.id)}" alt="${w.id}" onclick="openLightbox(this.src,'${w.id}')"></div>`;
  });
  canvas.innerHTML = html;
  numEl.textContent = 'LOOK ' + look.num;
}

  const days = ['일','월','화','수','목','금','토'];

    `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} (${days[d.getDay()]})`;

renderRecords();
renderRefs();
renderHome();
